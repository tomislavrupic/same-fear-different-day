name: Publish KitiKat catalog
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner behavior
        run: npm test
      - name: Build versioned release
        run: |
          node scripts/build.mjs
          node tests/release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
